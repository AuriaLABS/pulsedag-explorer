name: Explorer CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:fixtures
      - run: npm run validate:pagination
      - run: npm run validate:proxy
      - name: Install nginx for routing validation
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi
      - run: bash scripts/validate-nginx-runtime.sh
      - run: npm run validate:v3-readiness
      - run: npm run validate:container
      - run: node --check scripts/smoke-live-rpc.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Build production container
        run: docker build -t pulsedag-explorer-ci .
      - name: Smoke production container
        run: |
          set -euo pipefail
          docker run -d --name pulsedag-explorer-ci --add-host pulsedagd:127.0.0.1 -p 18082:8080 pulsedag-explorer-ci
          trap 'docker rm -f pulsedag-explorer-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/healthz | grep -qx 'ok'; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18082/healthz | grep -qx 'ok'
          test "$(docker inspect --format '{{.Config.User}}' pulsedag-explorer-ci)" = "nginx"
          test "$(docker inspect --format '{{.State.Health.Status}}' pulsedag-explorer-ci)" != "unhealthy"
