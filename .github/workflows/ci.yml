name: Explorer CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:fixtures
      - run: npm run validate:pagination
      - run: npm run validate:proxy
      - name: Install nginx for routing validation
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi
      - run: bash scripts/validate-nginx-runtime.sh
      - run: npm run validate:v3-readiness
      - run: npm run validate:artifact
      - run: node --check scripts/smoke-live-rpc.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Package checksummed explorer build
        run: bash scripts/package-build-artifact.sh
      - name: Upload checksummed explorer build
        uses: actions/upload-artifact@v4
        with:
          name: pulsedag-explorer-${{ github.sha }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.provenance.txt
          if-no-files-found: error
          retention-days: 30
